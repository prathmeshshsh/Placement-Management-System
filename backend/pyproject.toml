[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "placement-management-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0,<3", "pymysql>=1.1", "alembic>=1.13", "pydantic>=2.8,<3", "pydantic-settings>=2.4", "email-validator>=2.2", "PyJWT[crypto]>=2.9", "pwdlib[argon2]>=0.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
